apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector:
    app: payment
  type: ClusterIP
  ports:
    - name: payment-port
      protocol: TCP
      port: 4003
      targetPort: payment-port
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-deployment
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: payment
      containers:
        - name: payment
          image: djeukeu/online-learning-payment:1
          imagePullPolicy: IfNotPresent
          ports:
            - name: payment-port
              containerPort: 4003
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '250m'
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: payment-port
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: payment-port
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /db-health
              port: payment-port
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: payment-env
                  key: port
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: payment-env
                  key: app_name
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: project-env
                  key: app_env
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: db_url
            - name: JWT
              valueFrom:
                secretKeyRef:
                  name: project-secrets
                  key: jwt
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: payment