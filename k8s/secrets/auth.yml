apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-db
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: auth-secrets
    template:
      data:
        db_url: "mysql://{{ .username | urlquery }}:{{ .password | urlquery }}@${AUTH_DB_HOST}:${AUTH_DB_PORT}/${AUTH_DB_NAME}"
  dataFrom:
    - extract:
        key: ${AUTH_DB_SECRET_ARN}