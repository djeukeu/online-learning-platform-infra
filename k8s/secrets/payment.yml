apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payment-db
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: payment-secrets
    template:
      data:
        db_url: "postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@${PAYMENT_DB_HOST}:${PAYMENT_DB_PORT}/${PAYMENT_DB_NAME}"
  dataFrom:
    - extract:
        key: ${PAYMENT_DB_SECRET_ARN}