apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: course-db
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: course-secrets
    template:
      data:
        db_url: "postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@${COURSE_DB_HOST}:${COURSE_DB_PORT}/${COURSE_DB_NAME}"
  dataFrom:
    - extract:
        key: ${COURSE_DB_SECRET_ARN}