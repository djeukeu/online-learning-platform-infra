apiVersion: v1
kind: Service
metadata:
  name: course-service
spec:
  selector:
    app: course
  type: ClusterIP
  ports:
    - name: course-port
      protocol: TCP
      port: 4002
      targetPort: course-port
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-deployment
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: course
  template:
    metadata:
      labels:
        app: course
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: course
      containers:
        - name: course
          image: djeukeu/online-learning-course:1
          imagePullPolicy: IfNotPresent
          ports:
            - name: course-port
              containerPort: 4002
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: course-port
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: course-port
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /db-health
              port: course-port
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: course-env
                  key: port
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: course-env
                  key: app_name
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: project-env
                  key: app_env
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: course-secrets
                  key: db_url
            - name: JWT
              valueFrom:
                secretKeyRef:
                  name: project-secrets
                  key: jwt

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: course-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: course