name: TF Deploy
run-name: ${{ github.actor }} triggered the TF Deploy

on:
  push:
    branches:
      - develop
      - master
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: 1.16.1
  TF_STATE_KEY: ${{ github.ref_name == 'master' && 'online-learning/terraform.tfstate' || 'online-learning/stage/terraform.tfstate' }}

jobs:
  deploy:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Write terraform variable files
        run: |
          echo '${{ secrets.TF_VARS }}' > terraform.tfvars
      - name: Terraform Init
        run: terraform init -backend-config="key=$TF_STATE_KEY"
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
      # - name: Write terraform ouput
      #   run: terraform output -json > output.json
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: tf-output
      #     path: terraform/output.json
